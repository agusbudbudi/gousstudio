<!DOCTYPE html>
<html lang="id" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <!-- Paint light pages with their own background from the first frame, before CSS/JS load
       (App.tsx keeps these attributes in sync after load) -->
  <script>
    (function () {
      var p = location.pathname;
      var root = document.documentElement;
      if (p === '/cms' || p.indexOf('/cms/') === 0) {
        root.setAttribute('data-cms-shell', '');
      } else {
        // Every other route (including the 404 page) is on the brand shell
        root.setAttribute('data-gs-shell', '');
      }
    })();
  </script>
  <style>
    html[data-gs-shell], html[data-gs-shell] body { background-color: #f7f6f2; }
    html[data-cms-shell], html[data-cms-shell] body { background-color: #fbfbf9; }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
